name: Bench

on:
  schedule:
    - cron: '0 0 * * 3'
  workflow_dispatch:
    inputs: &inputs
      version:
        required: false
        default: ''
        type: string
      target:
        required: false
        default: ''
        type: string
      skip_push:
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs: *inputs

permissions:
  contents: read

jobs:
  bench:
    if: ${{ !inputs.target }}
    name: ${{ matrix.backend.id }}:${{ matrix.target }}
    runs-on: ${{ matrix.backend.runner }}
    container:
      image: ${{ matrix.backend.container }}
    strategy:
      fail-fast: false
      matrix:
        backend: &backend
          - id: gfx1151
            runner: [self-hosted, Linux, devlab-dispatch, strix-halo]
            container: ''
        target:

          - unsloth/gpt-oss-120b-GGUF:Q5_K_M
          - unsloth/gpt-oss-120b-GGUF:Q5_K_S
          - unsloth/gpt-oss-120b-GGUF:Q6_K
          - unsloth/gpt-oss-120b-GGUF:Q8_0
          - unsloth/gpt-oss-20b-GGUF:F16
          - unsloth/gpt-oss-20b-GGUF:Q3_K_M
          - unsloth/gpt-oss-20b-GGUF:Q3_K_S
          - unsloth/gpt-oss-20b-GGUF:Q4_0
          - unsloth/gpt-oss-20b-GGUF:Q4_1
          - unsloth/gpt-oss-20b-GGUF:Q4_K_M
          - unsloth/gpt-oss-20b-GGUF:Q4_K_S
          - unsloth/gpt-oss-20b-GGUF:Q5_K_M
          - unsloth/gpt-oss-20b-GGUF:Q5_K_S
          - unsloth/gpt-oss-20b-GGUF:Q6_K
          - unsloth/gpt-oss-20b-GGUF:Q8_0
    steps: &steps
      - uses: actions/checkout@v5

      - name: Install
        env:
          LLAMA_BUCKET: ${{ vars.HF_REPO }}
          LLAMA_VERSION: ${{ inputs.version }}
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
        run: SKIP_INSTALL=1 sh install.sh

      - name: Download model
        id: download
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
          TARGET: ${{ matrix.target }}
        run: |
          if ~/.llama-app/llama download -hf "$TARGET" 1>/dev/null
          then echo "present=true"
          else echo "::notice::$TARGET not present, skipping" >&2
               echo "present=false"
          fi >> "$GITHUB_OUTPUT"

      - name: Bench
        if: steps.download.outputs.present == 'true'
        env:
          TARGET: ${{ matrix.target }}
          BACKEND: ${{ matrix.backend.id }}
        run: |
          MODEL="${TARGET%:*}"
          QUANT="${TARGET##*:}"
          NAME="$MODEL"
          NAME="${NAME%-GGUF}"
          NAME="${NAME#*/}"
          rm -rf output
          mkdir -p "output/$BACKEND/$NAME"
          bench() { ~/.llama-app/llama bench --offline -v -fa 0,1 -hf "$MODEL:$QUANT" -o jsonl -r 10 "$@"; }
          bench > "output/$BACKEND/$NAME/$QUANT.jsonl"

      - name: Push
        if: steps.download.outputs.present == 'true' && !inputs.skip_push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_BENCHES }}
          REPO: ${{ vars.HF_REPO_BENCHES }}
        run: |
          OUT=$(~/.llama-app/llama version 2>&1)
          case "$OUT" in
          (*"build "[0-9]*) N=${OUT#*"build "}; N=${N%%,*} ;;
          (b[0-9]*)         N=${OUT#b};         N=${N%%-*} ;;
          (*) echo "Could not parse llama version: $OUT"; exit 1 ;;
          esac
          VERSION=b$N
          python3 -m pip install -U --break-system-packages huggingface_hub
          python3 scripts/upload.py "$REPO/$VERSION"

  custom:
    if: ${{ inputs.target != '' }}
    name: ${{ matrix.backend.id }}:${{ matrix.target }}
    runs-on: ${{ matrix.backend.runner }}
    container:
      image: ${{ matrix.backend.container }}
    strategy:
      matrix:
        backend: *backend
        target:
          - ${{ inputs.target }}
    steps: *steps

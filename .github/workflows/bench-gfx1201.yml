name: Bench gfx1201

on:
  schedule:
    - cron: '0 0 * * 3'
  workflow_dispatch:
    inputs: &inputs
      version:
        required: false
        default: ''
        type: string
      target:
        required: false
        default: ''
        type: string
      skip_push:
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs: *inputs

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.target }}
    runs-on: [self-hosted, Linux, devlab-dispatch, radeon-r9700]
    strategy:
      fail-fast: false
      matrix:
        target:
          - LiquidAI/LFM3-Omni-2B-GGUF:BF16
          - LiquidAI/LFM3-Omni-2B-GGUF:Q4_0
          - LiquidAI/LFM3-Omni-2B-GGUF:Q4_K_M
          - LiquidAI/LFM3-Omni-2B-GGUF:Q8_0
